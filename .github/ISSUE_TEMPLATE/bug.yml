name: Bug report
description: Report a reproducible failure without credentials or private conversations.
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: OS, Node version, backend and channel
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove keys, tokens, cookies, account IDs and private messages.
